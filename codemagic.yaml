workflows:
  ios-compile-check:
    name: Orange iOS - Compile Check
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: 3.38.7
      xcode: 16.4
      cocoapods: default
      vars:
        API_BASE_URL: "https://orange-app-backend.blockchaintestin.workers.dev/"
        BUNDLE_ID: "com.blockchaintestin.orangeapp"
        IOS_DISTRIBUTION: "0"
        REQUIRE_FIREBASE_IOS: "0"

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Configure Orange iOS build
        script: |
          bash codemagic/configure_ios.sh

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update

      - name: Compile iOS app without code signing
        script: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="AGORA_APP_ID=${AGORA_APP_ID:-}" \
            --dart-define="REVENUECAT_IOS_PUBLIC_KEY=${REVENUECAT_IOS_PUBLIC_KEY:-}"

      - name: Package compile-check app
        script: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app Orange-iOS-Unsigned-App.zip

    artifacts:
      - build/ios/iphoneos/Orange-iOS-Unsigned-App.zip
      - /tmp/xcodebuild_logs/*.log
